<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Virtup</title>
  <meta name="description" content="Virtup — Building IT infrastructure." />
  <link rel="icon" href="virtup-logo.png" />
  <style>
    /* ===== Theme ========================================================= */
    :root{
      --bg:#0b0c10;         /* main background (dark) */
      --panel:#14171e;      /* dark card */
      --panel-2:#0f1217;    /* darker surface */
      --fg:#e7eaef;         /* text */
      --muted:#9aa3b2;      /* secondary text */
      --border:#242a36;     /* hairlines */
      --accent:#e7eaef;     /* link/buttons tint */
      --radius:18px;
      --maxw:1120px;
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#ffffff; --panel:#f5f6fa; --panel-2:#fafbfc; --fg:#101828; --muted:#667085; --border:#e6e8ec; --accent:#101828;
      }
    }

    /* ===== Base ========================================================== */
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      color:var(--fg);
      background:
        radial-gradient(1100px 560px at 85% -240px, rgba(88,120,255,.18), transparent 60%),
        radial-gradient(900px 500px at -10% -200px, rgba(0,166,255,.12), transparent 60%),
        var(--bg);
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
      scroll-behavior:smooth;
    }
    a{color:inherit; text-decoration:none}
    a:hover{text-decoration:underline}
    a:visited{color:inherit}
    .wrap{max-width:var(--maxw); margin:0 auto; padding:0 20px 80px}

    /* ===== Header ======================================================== */
    header{
      position:sticky; top:0; z-index:20;
      background:linear-gradient(to bottom, color-mix(in oklab,var(--bg) 96%, transparent), transparent);
      backdrop-filter: blur(6px) saturate(130%);
    }
    .head{
      display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 0;
    }
    .brand{display:flex; align-items:center; gap:12px}
    .brand img{width:40px; height:40px; border-radius:12px; object-fit:contain; box-shadow:0 4px 18px rgba(0,0,0,.25)}
    .brand span{font-weight:700; letter-spacing:.2px}
    nav{display:flex; gap:10px}
    nav a{
      font-size:14.5px; padding:8px 14px; border-radius:999px; border:1px solid var(--border); background:var(--panel-2);
    }
    nav a:hover{border-color:color-mix(in oklab,var(--border), var(--fg) 25%)}

    /* ===== Sections / dividers ========================================== */
    .section{padding:84px 0}
    .section--tight{padding:56px 0}
    /* sleek divider above each section except the first */
    .section + .section{position:relative}
    .section + .section::before{
      content:""; position:absolute; top:-1px; left:0; right:0; height:1px;
      background:linear-gradient(to right, transparent, color-mix(in oklab,var(--border), var(--fg) 10%), transparent);
      pointer-events:none;
    }

    /* ===== Hero ========================================================== */
    .hero{ text-align:center }
    .title{ font-size:clamp(40px,7vw,64px); margin:0 0 14px; font-weight:900; letter-spacing:.15px }
    .sub{ color:var(--muted); font-size:clamp(16px,2.2vw,20px); margin:0 auto; max-width:820px }

    /* ===== Work row (bigger) ============================================ */
    .row{
      margin-top:44px; display:flex; gap:18px; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:2px 2px 10px;
      scroll-snap-type:x proximity; mask-image: linear-gradient(to right, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%);
    }
    .card{
      scroll-snap-align:center;
      min-width:340px; flex:1 0 0;
      background:linear-gradient(180deg, color-mix(in oklab, var(--panel) 94%, transparent), var(--panel));
      border:1px solid var(--border); border-radius:var(--radius);
      box-shadow:0 14px 40px rgba(0,0,0,.2), inset 0 0 0 1px rgba(255,255,255,.02);
      padding:22px 22px 20px;
      display:flex; align-items:center; justify-content:space-between; gap:8px;
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .card h3{margin:0; font-size:20px}
    .card:hover{ transform: translateY(-4px); box-shadow:0 22px 54px rgba(0,0,0,.28); border-color: color-mix(in oklab,var(--border), var(--fg) 35%) }
    .arrow{opacity:.85; border:1px solid var(--border); border-radius:12px; width:38px; height:38px; display:grid; place-items:center}
    .card:hover .arrow{ border-color:color-mix(in oklab,var(--border), var(--fg) 40%) }

    /* ===== Contrast (white) section ===================================== */
    .contrast{
      background:#ffffff; color:#111; border-top:1px solid #e9eaee; border-bottom:1px solid #e9eaee;
    }
    .contrast .muted{ color:#6b7280 }
    .contact-card{
      margin:24px auto 0; max-width:720px;
      border:1px solid #e6e8ec; border-radius:16px; background:#f8fafc;
      padding:22px; text-align:center;
      box-shadow:0 12px 34px rgba(0,0,0,.06);
    }
    .email-chip{
      display:inline-block; margin-top:8px; padding:8px 12px; border-radius:12px; border:1px solid #e6e8ec;
      background:#fff; color:#111; text-decoration:none;
    }
    .email-chip:hover{ text-decoration:none; border-color:#111 }

    /* ===== Bottom CTA & footer ========================================== */
    .cta{ text-align:center; margin-top:40px }
    .cta a{
      display:inline-block; padding:14px 20px; border-radius:14px;
      border:1px solid var(--border); background:var(--panel-2); text-decoration:none;
    }
    .cta a:hover{ border-color:color-mix(in oklab,var(--border), var(--fg) 25%) }
    footer{ margin-top:56px; padding:24px 0; color:var(--muted); border-top:1px solid var(--border) }

    /* reduce motion */
    @media (prefers-reduced-motion: reduce){ .card,.cta a{ transition:none } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="head">
        <a class="brand" href="#top" aria-label="Home">
          <img src="virtup-logo.png" alt="Virtup logo" />
          <span>Virtup</span>
        </a>
        <nav>
          <a href="#about">About</a>
          <a href="#work">Work</a>
          <a href="#contact">Contact</a>
        </nav>
      </div>
    </header>

    <main id="top">
      <!-- Hero (big) -->
      <section class="section hero" id="about">
        <h1 class="title">Building IT infrastructure.</h1>
        <p class="sub">Simple. Reliable. Maintainable.</p>
      </section>

      <!-- Work (bigger cards + divider above) -->
      <section class="section section--tight" id="work" aria-label="Work">
        <div class="row">
          <a class="card" href="#contact" aria-label="DevOps and SRE">
            <h3>DevOps &amp; SRE</h3><div class="arrow">→</div>
          </a>
          <a class="card" href="#contact" aria-label="Backend engineering">
            <h3>Backend Engineering</h3><div class="arrow">→</div>
          </a>
          <a class="card" href="#contact" aria-label="Advisory">
            <h3>Advisory</h3><div class="arrow">→</div>
          </a>
        </div>
      </section>

      <!-- Contrast (white) Contact section with sleek dividers -->
      <section class="section contrast" id="contact" aria-label="Contact">
        <h2 style="margin:0 0 6px; text-align:center; font-size:28px; font-weight:800;">Contact</h2>
        <p class="muted" style="text-align:center; margin:0;">Let’s talk.</p>
        <div class="contact-card">
          <div><strong>Email</strong></div>
          <a class="email-chip" href="mailto:info@virtup.eu">info@virtup.eu</a>
        </div>
        <div class="cta">
          <a href="mailto:info@virtup.eu">Get in touch →</a>
        </div>
      </section>

      <footer>
        © <span id="y"></span> Virtup.
      </footer>
    </main>
  </div>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
  </script>
</body>
</html>
