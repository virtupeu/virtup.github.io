<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtup</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f8fa;
      color: #333;
      text-align: center;
    }
    header {
      padding: 2rem;
    }
    header img {
      height: 80px;
    }
    h1 {
      font-size: 2.5rem;
      margin: 1rem 0;
    }
    p {
      font-size: 1.2rem;
      margin: 0.5rem 0 2rem;
    }
    .panels {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 2rem auto;
      max-width: 800px;
    }
    .panel {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      flex: 1;
    }
    .contact {
      margin: 3rem 0;
    }
    .contact a {
      display: inline-block;
      margin: 0.5rem;
      padding: 0.8rem 1.5rem;
      border-radius: 20px;
      background: #333;
      color: white;
      text-decoration: none;
      transition: background 0.3s;
    }
    .contact a:hover {
      background: #555;
    }
    footer {
      margin: 2rem 0;
      font-size: 0.9rem;
      color: #777;
    }
  </style>
</head>
<body>
  <header>
    <img src="virtup-logo.png" alt="Virtup Logo">
    <h1>Virtup</h1>
    <p>Building IT infrastructure</p>
  </header>

  <section class="panels">
    <div class="panel">DevOps & SRE</div>
    <div class="panel">Backend Engineering</div>
    <div class="panel">Cloud Solutions</div>
  </section>

  <section class="contact">
    <h2>Get in touch</h2>
    <a href="mailto:info@virtup.eu"><i class="fa fa-envelope"></i> info@virtup.eu</a>
    <a href="https://www.linkedin.com/company/virtup" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>
  </section>

  <footer>
    © 2025 Virtup
  </footer>
</body>
</html>
