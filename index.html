<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Virtup</title>
  <meta name="description" content="Virtup — IT Services." />
  <link rel="icon" href="virtup-logo.png" />
  <style>
    :root{
      --bg:#0b0c10; --panel:#14171e; --panel-2:#0f1217;
      --fg:#e7eaef; --muted:#9aa3b2; --border:#242a36;
      --radius:18px; --maxw:1120px;
    }
    @media (prefers-color-scheme: light){
      :root{--bg:#fff; --panel:#f5f6fa; --panel-2:#fafbfc; --fg:#101828; --muted:#667085; --border:#e6e8ec;}
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--fg); background:var(--bg);
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
      scroll-behavior:smooth;
    }
    a{color:inherit; text-decoration:none}
    a:hover{text-decoration:underline}
    a:visited{color:inherit}
    .wrap{max-width:var(--maxw); margin:0 auto; padding:0 20px 40px}

    /* ===== Header (full-bleed glass, safe-area aware, fade to bottom) ===== */
    header{ position: sticky; top: 0; z-index: 50; }
    header::before{
      content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
      width:100vw; height:100%;
      backdrop-filter: blur(10px) saturate(130%); -webkit-backdrop-filter: blur(10px) saturate(130%);
      background:linear-gradient(
        to bottom,
        color-mix(in oklab, var(--bg) 82%, transparent) 0%,
        color-mix(in oklab, var(--bg) 55%, transparent) 60%,
        color-mix(in oklab, var(--bg) 35%, transparent) 85%,
        transparent 100%
      );
      pointer-events:none; z-index:-1;
    }
    header::after{
      content:""; position:absolute; left:50%; transform:translateX(-50%); bottom:0; width:100vw; height:1px;
      background:linear-gradient(to right, transparent, color-mix(in oklab,var(--border), var(--fg) 12%), transparent);
      pointer-events:none;
    }
    .head{
      width:100%; display:flex; align-items:center; justify-content:space-between; gap:16px;
      padding-top:calc(16px + env(safe-area-inset-top)); padding-bottom:16px; /* ~15% taller */
    }
    @media (max-width:900px){
      .head{ padding-top:calc(12px + env(safe-area-inset-top)); padding-bottom:12px; }
    }
    nav{display:flex; gap:10px; flex-wrap:wrap}
    nav a{font-size:14.5px; padding:8px 14px; border-radius:999px; border:1px solid var(--border); background:var(--panel-2)}
    nav a:hover{border-color:color-mix(in oklab,var(--border), var(--fg) 25%)}
    .right{display:flex; align-items:center; gap:12px}
    .brand{display:flex; align-items:center; gap:12px}
    .brand img{width:46px; height:46px; border-radius:12px; object-fit:contain; box-shadow:0 4px 18px rgba(0,0,0,.25)} /* +15% */
    .jira-btn{ padding:8px 14px; border-radius:999px; border:1px solid var(--border); background:var(--panel); font-size:14.5px }
    .jira-btn:hover{ border-color:color-mix(in oklab,var(--border), var(--fg) 25%) }

    /* ===== Sections with full-bleed repeating bg ===== */
    .section{position:relative; overflow:visible; padding:104px 0}
    .section + .section::after{
      content:""; position:absolute; top:-1px; left:0; right:0; height:1px;
      background:linear-gradient(to right, transparent, color-mix(in oklab,var(--border), var(--fg) 10%), transparent);
      pointer-events:none;
    }
    .section::before{
      content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
      width:100vw; height:100%;
      background-image:url('it.png'); background-repeat:repeat; background-position:center; background-size:640px auto;
      filter: blur(10px); opacity:.20; z-index:-1;
    }
    .bg-light::before{ opacity:.28; filter: blur(10px) brightness(1.35) saturate(0.8); }
    .bg-dark::before{  opacity:.18; filter: blur(12px) invert(1) brightness(0.35) saturate(0.7); }

    /* “Glass” wrapper */
    .glass{
      border:1px solid color-mix(in oklab,var(--border), var(--fg) 8%);
      background: color-mix(in oklab, var(--panel-2), transparent 60%);
      backdrop-filter: blur(9px) saturate(140%); -webkit-backdrop-filter: blur(9px) saturate(140%);
      border-radius:16px; padding:22px;
      box-shadow:0 10px 34px rgba(0,0,0,.18), inset 0 0 0 1px rgba(255,255,255,.02);
    }
    .glass--tb{ border-width:1px 0; border-left:0; border-right:0; border-radius:0; box-shadow:0 10px 34px rgba(0,0,0,.18); }

    /* ===== Hero ===== */
    .hero{text-align:center}
    .title{font-size:clamp(26px,4.8vw,42px); margin:0 0 12px; font-weight:900; letter-spacing:.15px}
    .sub{color:var(--muted); font-size:clamp(15px,2.2vw,18px); margin:0 auto; max-width:820px}

    /* ===== Services row ===== */
    .section--less-bottom{padding-bottom:73px}
    .no-top-divider::after{display:none}
    .section--tight{padding:18px 0 40px}
    .row{
      margin-top:14px; display:flex; gap:18px; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:2px 2px 10px;
      scroll-snap-type:x proximity; mask-image: linear-gradient(to right, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%);
    }
    .card{
      scroll-snap-align:center;
      min-width:340px; flex:1 0 0;
      background:linear-gradient(180deg, color-mix(in oklab, var(--panel) 94%, transparent), var(--panel));
      border-width:1px 0; border-style:solid; border-color:var(--border); /* top/bottom only */
      border-radius:0; box-shadow:0 14px 40px rgba(0,0,0,.2);
      padding:22px; display:flex; align-items:center; justify-content:center; text-align:center;
      font-size:20px; font-weight:700;
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      backdrop-filter: blur(6px) saturate(120%); -webkit-backdrop-filter: blur(6px) saturate(120%);
    }
    .card:hover{transform:translateY(-4px); box-shadow:0 22px 54px rgba(0,0,0,.28); border-color:color-mix(in oklab,var(--border), var(--fg) 35%)}
    .card:hover, .card:focus{ text-decoration:none }

    /* ===== Form (top spacing reduced by 25%) ===== */
    .section--less-top-25{padding-top:78px}
    .form-card{
      max-width:820px; margin:0 auto;
      border:1px solid var(--border); background:var(--panel-2); border-radius:16px;
      padding:27px; /* +5px */
      box-shadow:0 14px 40px rgba(0,0,0,.18);
      backdrop-filter: blur(8px) saturate(120%); -webkit-backdrop-filter: blur(8px) saturate(120%);
    }

    /* Reveal-on-scroll animation */
    .reveal{opacity:0; transform:translateY(42px); transition:transform .6s cubic-bezier(.2,.65,.2,1), opacity .6s ease; will-change:transform,opacity;}
    .reveal.in-view{opacity:1; transform:translateY(0);}
    @media (prefers-reduced-motion: reduce){
      .reveal{opacity:1; transform:none; transition:none;}
    }

    label{display:block; font-size:14px; color:var(--muted); margin:12px 0 6px}
    input, textarea{
      width:100%; padding:17px 19px; /* +5px field padding */
      color:var(--fg); background:var(--panel); border:1px solid var(--border); border-radius:12px; outline:none;
    }
    input:focus, textarea:focus{border-color:color-mix(in oklab,var(--border), var(--fg) 35%)}
    textarea{min-height:140px; resize:vertical}
    .form-actions{margin-top:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
    .btn{display:inline-block; padding:12px 16px; border-radius:12px; border:1px solid var(--border); background:var(--panel)}
    .btn:hover{border-color:color-mix(in oklab,var(--border), var(--fg) 25%)}
    .btn.primary{color:#fff}
    .status{font-size:14px; color:var(--muted)}

    footer{
      margin-top:56px; padding:24px 0; color:var(--muted);
      border-top:1px solid var(--border);
      font-size:80%; text-align:center; /* 20% smaller */
    }

    /* ===== Mobile (≤720px) overrides ===== */
    @media (max-width:720px){
      .wrap{padding:0 12px 32px}       /* wider feel on mobile */
      .section{padding:84px 0}

      /* 40% of previous gap under hero */
      .section--less-bottom{padding-bottom:20px;}
      .section--tight{padding:10px 0 32px;}

      .section--less-top-25{padding-top:70px}
      .row{flex-wrap:wrap; overflow-x:visible}
      .card{min-width:100%}
      nav{gap:8px}
      .jira-btn{padding:8px 12px}
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap head">
      <nav>
        <a href="#about">About</a>
        <a href="#work">Work</a>
        <a href="#form">Contact</a>
      </nav>
      <div class="right">
        <a class="brand" href="#top" aria-label="Home">
          <img src="virtup-logo.png" alt="Virtup logo" />
        </a>
        <a class="jira-btn" href="https://virtup.atlassian.net/jira/software/projects/VIR/list" target="_blank" rel="noopener">Jira</a>
      </div>
    </div>
  </header>

  <main id="top">
    <!-- HERO -->
    <section class="section section--less-bottom bg-light hero" id="about" style="height:300px; padding-top:30px;">
      <div class="wrap">
        <div class="glass glass--tb" style="max-width:820px;margin:0 auto; height:180px;">
          <h1 class="title" style="margin-top:6px;">IT Services</h1>
          <p class="sub">Simple. Reliable. Maintainable.</p>
        </div>
      </div>
    </section>

    <!-- SERVICES -->
    <section class="section section--tight no-top-divider bg-dark" id="work" aria-label="Work">
      <div class="wrap">
        <div class="glass glass--tb" style="padding:28px;">
          <div class="row">
            <a class="card" style="font-size:medium;" href="#form">DevOps  SRE</a>
            <a class="card" style="font-size:medium;" href="#form">Backend Engineering</a>
            <a class="card" style="font-size:medium;" href="#form">ML &amp; AI Integration</a>
          </div>
        </div>
      </div>
    </section>

    <!-- CONTACT FORM (slides up on scroll) -->
    <section class="section section--less-top-25 bg-light" id="form" aria-labelledby="formTitle" style="padding-top:0;">
      <div class="wrap">
        <div class="form-card reveal">
          <form action="https://formsubmit.co/info@virtup.eu" method="POST">
            <h2 id="formTitle" style="margin:0 0 16px; font-size:24px; font-weight:800; text-align:left;">Send a message</h2>

            <label for="name">Name</label>
            <input id="name" name="name" placeholder="Your name" required />

            <label for="email">Your email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required />

            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="How can we help?" required></textarea>

            <!-- options -->
            <input type="hidden" name="_subject" value="Contact from virtup.eu" />
            <input type="hidden" name="_captcha" value="false" />
            <input type="hidden" name="_next" value="https://www.virtup.eu/?sent=1#form" />
            <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off" />

            <div class="form-actions">
              <button class="btn primary" type="submit">Send email</button>
              <span class="status" id="status"></span>
            </div>
          </form>
        </div>
      </div>
    </section>

    <footer>
      <div class="wrap">Virtup 2025.</div>
    </footer>
  </main>

  <script>
    // Show success message when returning from FormSubmit
    if (new URLSearchParams(location.search).get('sent') === '1') {
      const s = document.getElementById('status');
      if (s) { s.textContent = 'Sent. Thanks! ✅'; s.style.color = '#7dd87d'; }
    }

    // Reveal-on-scroll for the form (slides up)
    (function(){
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const els = document.querySelectorAll('.reveal');
      if (!els.length) return;

      if (prefersReduced || !('IntersectionObserver' in window)) {
        els.forEach(el => el.classList.add('in-view'));
        return;
      }

      const io = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('in-view');
            io.unobserve(entry.target); // animate once
          }
        });
      }, {
        root: null,
        rootMargin: '0px 0px -10% 0px', // start a bit before full view
        threshold: 0.15
      });

      els.forEach(el => io.observe(el));
    })();
  </script>
</body>
</html>
