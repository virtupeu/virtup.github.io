<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Virtup</title>
  <meta name="description" content="Virtup — Building IT infrastructure." />
  <link rel="icon" href="virtup-logo.png" />

  <style>
    /* ==== Theme =========================================================== */
    :root{
      --bg:#0b0d12;
      --panel:#12151c;
      --panel-2:#0e1117;
      --fg:#e6e9ef;
      --muted:#98a2b3;
      --border:#232936;
      --accent:#8ab4ff;           /* subtle indigo/blue */
      --ring: rgba(138,180,255,.35);
      --radius:18px;
      --maxw:1040px;
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#ffffff;
        --panel:#f6f7fb;
        --panel-2:#f9fafb;
        --fg:#0f172a;
        --muted:#667085;
        --border:#e5e7eb;
        --accent:#3b82f6;
        --ring: rgba(59,130,246,.25);
      }
    }

    /* ==== Base ============================================================ */
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
      color:var(--fg);
      background:
        radial-gradient(1000px 500px at 80% -200px, rgba(79,70,229,.25), transparent 55%),
        radial-gradient(800px 500px at -10% -200px, rgba(0,141,255,.18), transparent 55%),
        var(--bg);
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
      scroll-behavior:smooth;
    }
    .wrap{max-width:var(--maxw); margin:0 auto; padding:28px 20px 72px}

    /* ==== Header ========================================================== */
    header{
      display:flex; align-items:center; justify-content:space-between; gap:16px;
      position:sticky; top:0; z-index:10; padding:10px 0 24px;
      background: linear-gradient(to bottom, color-mix(in oklab, var(--bg) 96%, transparent), transparent);
      backdrop-filter: blur(6px) saturate(130%);
    }
    .brand{display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit}
    .brand img{width:40px; height:40px; border-radius:12px; object-fit:contain; box-shadow:0 4px 18px rgba(0,0,0,.25)}
    .brand span{font-weight:700; letter-spacing:.2px; font-size:16px}

    /* pill nav */
    nav{display:flex; gap:10px}
    nav a{
      text-decoration:none; color:inherit; font-size:14.5px;
      padding:8px 14px; border-radius:999px; border:1px solid var(--border); background:var(--panel-2);
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }
    nav a:hover{border-color:color-mix(in oklab, var(--border), var(--fg) 25%);}
    nav a:focus-visible{outline:2px solid var(--ring); outline-offset:2px}

    /* ==== Hero ============================================================ */
    .hero{padding:46px 0 8px; text-align:center}
    .title{font-size:clamp(32px,6vw,56px); margin:0 0 12px; font-weight:900; letter-spacing:.1px}
    .sub{color:var(--muted); font-size:clamp(15px,2.2vw,18px); margin:0 auto; max-width:780px}

    /* ==== Cards row ======================================================= */
    .row{
      margin:42px 0 18px;
      display:flex; gap:16px; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:10px;
      scroll-snap-type:x proximity;
      mask-image: linear-gradient(to right, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%);
    }
    .card{
      scroll-snap-align:center;
      min-width:310px; flex:1 0 0;
      border:1px solid var(--border); border-radius:var(--radius);
      background:linear-gradient(180deg, color-mix(in oklab, var(--panel) 92%, transparent), var(--panel));
      box-shadow: 0 12px 40px rgba(0,0,0,.18), inset 0 0 0 1px rgba(255,255,255,.02);
      padding:18px 18px 16px;
      display:flex; justify-content:space-between; align-items:flex-start; gap:8px;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .card:hover{ transform: translateY(-3px); box-shadow: 0 18px 46px rgba(0,0,0,.26); border-color: color-mix(in oklab, var(--border), var(--accent) 35%) }
    .card h3{margin:2px 0 0; font-size:18px}
    .arrow{margin-left:auto; opacity:.85; border:1px solid var(--border); border-radius:12px; width:36px; height:36px; display:grid; place-items:center}
    .card:hover .arrow{border-color:color-mix(in oklab, var(--border), var(--accent) 40%)}
    .card a{text-decoration:none; color:inherit}
    .card a:focus-visible{outline:2px solid var(--ring); border-radius:12px}

    /* ==== Contact strip & CTA ============================================ */
    .strip{
      margin-top:40px; padding:16px 18px; text-align:center;
      border:1px dashed var(--border); border-radius:16px; color:var(--muted);
      background: color-mix(in oklab, var(--panel), transparent 35%);
    }
    .strip a{color:var(--fg); text-decoration:none; border-bottom:1px dotted color-mix(in oklab, var(--fg), var(--accent) 35%)}
    .strip a:hover{border-bottom-style:solid}

    .cta{
      margin:46px auto 0; text-align:center;
    }
    .cta a{
      display:inline-block; padding:14px 20px; border-radius:14px;
      background: linear-gradient(180deg, color-mix(in oklab, var(--accent) 28%, var(--panel)), var(--panel));
      border:1px solid color-mix(in oklab, var(--border), var(--accent) 35%);
      color:var(--fg); text-decoration:none;
      box-shadow: 0 8px 28px rgba(0,0,0,.25);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .cta a:hover{ transform: translateY(-1px); box-shadow: 0 12px 34px rgba(0,0,0,.32) }
    .cta a:focus-visible{ outline:2px solid var(--ring); outline-offset:3px }

    /* ==== Footer ========================================================== */
    footer{margin:46px 0 0; padding-top:24px; border-top:1px solid var(--border); color:var(--muted); font-size:14px}
    footer a{color:inherit}

    /* reduce motion */
    @media (prefers-reduced-motion: reduce){
      .card, .cta a{ transition:none }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="#top" aria-label="Home">
        <img src="virtup-logo.png" alt="Virtup logo">
        <span>Virtup</span>
      </a>
      <nav>
        <a href="#about">About</a>
        <a href="#work">Work</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero" id="about">
        <h1 class="title">Building IT infrastructure.</h1>
        <p class="sub">Simple. Reliable. Maintainable.</p>
      </section>

      <section id="work" class="row" aria-label="Work">
        <a class="card" href="#contact" aria-label="DevOps and SRE">
          <h3>DevOps &amp; SRE</h3>
          <div class="arrow">→</div>
        </a>
        <a class="card" href="#contact" aria-label="Backend engineering">
          <h3>Backend Engineering</h3>
          <div class="arrow">→</div>
        </a>
        <a class="card" href="#contact" aria-label="Advisory">
          <h3>Advisory</h3>
          <div class="arrow">→</div>
        </a>
      </section>

      <section id="contact" class="strip" aria-label="Contact">
        <strong>Contact</strong><br />
        <a href="mailto:info@virtup.eu">info@virtup.eu</a>
      </section>

      <div class="cta">
        <a href="mailto:info@virtup.eu">Get in touch →</a>
      </div>
    </main>

    <footer>
      © <span id="y"></span> Virtup.
    </footer>
  </div>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
  </script>
</body>
</html>
