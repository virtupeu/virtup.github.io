<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Virtup</title>
  <meta name="description" content="Virtup — Building IT infrastructure." />
  <link rel="icon" href="virtup-logo.png" />
  <style>
    :root{--bg:#fff;--fg:#111;--muted:#6b7280;--card:#f6f7f9;--border:#e5e7eb;--accent:#111;--radius:18px;--maxw:980px}
    @media (prefers-color-scheme: dark){
      :root{--bg:#0b0c0f;--fg:#e5e7eb;--muted:#9aa3b2;--card:#13151a;--border:#242833;--accent:#e5e7eb}
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--fg);background:radial-gradient(1200px 700px at 80% -200px,rgba(0,0,0,.06),transparent 60%),var(--bg);
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility
    }
    /* Make all links inherit theme color and avoid “blue/purple” */
    a{color:inherit;text-decoration:none}
    a:hover{ text-decoration:underline }
    a:visited{ color:inherit }

    .wrap{max-width:var(--maxw);margin:0 auto;padding:32px 20px 64px}
    header{
      display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0 28px;
      position:sticky;top:0;background:linear-gradient(to bottom,var(--bg),color-mix(in oklab,var(--bg),transparent 100%));
      backdrop-filter:saturate(140%) blur(6px);z-index:10
    }
    .brand{display:flex;align-items:center;gap:14px}
    .brand img{width:40px;height:40px;border-radius:10px;object-fit:contain}
    .brand span{font-weight:700;letter-spacing:.2px}
    nav{display:flex;gap:10px;align-items:center}
    nav a{
      font-size:14.5px;border:1px solid var(--border);background:var(--card);
      padding:8px 12px;border-radius:9999px;opacity:.95
    }
    nav a:hover{border-color:color-mix(in oklab,var(--border),var(--fg) 20%)}

    .hero{padding:40px 0 10px;text-align:center}
    .title{font-size:clamp(28px,5vw,40px);margin:0;font-weight:800;letter-spacing:.2px}
    .sub{color:var(--muted);font-size:clamp(15px,2.3vw,18px);max-width:760px;margin:10px auto 0}

    /* one-row panels with gentle shadow; horizontal scroll on small screens */
    .grid{margin:36px 0 18px;display:flex;flex-wrap:nowrap;gap:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
    .card{
      border:1px solid var(--border);background:var(--card);border-radius:var(--radius);
      padding:18px;min-height:120px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;
      transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;min-width:280px;flex:1 0 0;
      box-shadow:0 6px 14px rgba(0,0,0,.06)
    }
    .card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,0,0,.10);border-color:color-mix(in oklab,var(--border),var(--fg) 18%)}
    .card h3{margin:0;font-size:18px}
    .card .arrow{opacity:.75}

    .strip{
      margin-top:30px;padding:16px;border:1px dashed var(--border);border-radius:14px;text-align:center;background:color-mix(in oklab,var(--card),transparent 30%)
    }
    .email{
      display:inline-block;margin-top:6px;padding:6px 10px;border:1px solid var(--border);border-radius:10px;
      background:var(--card); text-decoration:none
    }
    .email:hover{border-color:var(--fg); text-decoration:none}

    .cta-bottom{margin:40px auto 0;text-align:center}
    .cta-bottom a{
      display:inline-block;padding:14px 18px;border:1px solid var(--border);border-radius:14px;background:var(--card)
    }
    .cta-bottom a:hover{border-color:var(--fg)}
    footer{margin:34px 0 0;padding-top:24px;border-top:1px solid var(--border);color:var(--muted);font-size:14px}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="#top">
        <img src="virtup-logo.png" alt="Virtup logo" />
        <span>Virtup</span>
      </a>
      <nav>
        <a href="#about">About</a>
        <a href="#work">Work</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero" id="about">
        <h1 class="title">Building IT infrastructure.</h1>
        <p class="sub">Simple, reliable, maintainable.</p>
      </section>

      <section id="work" class="grid" aria-label="Work">
        <a class="card" href="#contact" aria-label="DevOps and SRE">
          <h3>DevOps &amp; SRE</h3> <span class="arrow">→</span>
        </a>
        <a class="card" href="#contact" aria-label="Backend engineering">
          <h3>Backend Engineering</h3> <span class="arrow">→</span>
        </a>
        <a class="card" href="#contact" aria-label="Advisory">
          <h3>Advisory</h3> <span class="arrow">→</span>
        </a>
      </section>

      <section id="contact" class="strip" aria-label="Contact">
        <strong>Contact</strong><br>
        <a class="email" href="mailto:info@virtup.eu">info@virtup.eu</a>
      </section>

      <div class="cta-bottom">
        <a href="mailto:info@virtup.eu">Get in touch →</a>
      </div>
    </main>

    <footer>
      © <span id="y"></span> Virtup.
    </footer>
  </div>

  <script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
