<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Virtup</title>
  <meta name="description" content="Virtup — IT Services." />
  <link rel="icon" href="virtup-logo.png" />
  <style>
    /* ===== Theme ===== */
    :root{
      --bg:#0b0c10; --panel:#14171e; --panel-2:#0f1217;
      --fg:#e7eaef; --muted:#9aa3b2; --border:#242a36;
      --radius:18px; --maxw:1120px;
    }
    @media (prefers-color-scheme: light){
      :root{--bg:#fff; --panel:#f5f6fa; --panel-2:#fafbfc; --fg:#101828; --muted:#667085; --border:#e6e8ec;}
    }

    /* ===== Base ===== */
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--fg);
      background:
        radial-gradient(1100px 560px at 85% -240px, rgba(88,120,255,.18), transparent 60%),
        radial-gradient(900px 500px at -10% -200px, rgba(0,166,255,.12), transparent 60%),
        var(--bg);
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
      scroll-behavior:smooth;
    }
    a{color:inherit; text-decoration:none}
    a:hover{text-decoration:underline}           /* default */
    a:visited{color:inherit}

    .wrap{max-width:var(--maxw); margin:0 auto; padding:0 20px 80px}

    /* ===== Header ===== */
    header{
      position:sticky; top:0; z-index:20;
      background:linear-gradient(to bottom, color-mix(in oklab,var(--bg) 96%, transparent), transparent);
      backdrop-filter: blur(6px) saturate(130%);
    }
    .head{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 0}
    .brand{display:flex; align-items:center; gap:12px}
    .brand img{width:40px; height:40px; border-radius:12px; object-fit:contain; box-shadow:0 4px 18px rgba(0,0,0,.25)}
    .brand span{font-weight:700; letter-spacing:.2px}
    nav{display:flex; gap:10px}
    nav a{font-size:14.5px; padding:8px 14px; border-radius:999px; border:1px solid var(--border); background:var(--panel-2)}
    nav a:hover{border-color:color-mix(in oklab,var(--border), var(--fg) 25%)}

    /* ===== Sections & dividers ===== */
    .section{padding:84px 0}
    .section--tight{padding:56px 0}
    .section + .section{position:relative}
    .section + .section::before{
      content:""; position:absolute; top:-1px; left:0; right:0; height:1px;
      background:linear-gradient(to right, transparent, color-mix(in oklab,var(--border), var(--fg) 10%), transparent);
      pointer-events:none;
    }

    /* ===== Hero ===== */
    .hero{text-align:center}
    .title{font-size:clamp(40px,7vw,64px); margin:0 0 14px; font-weight:900; letter-spacing:.15px}
    .sub{color:var(--muted); font-size:clamp(16px,2.2vw,20px); margin:0 auto; max-width:820px}

    /* ===== Work row ===== */
    .row{
      margin-top:44px; display:flex; gap:18px; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:2px 2px 10px;
      scroll-snap-type:x proximity; mask-image: linear-gradient(to right, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%);
    }
    .card{
      /* clickable card as a centered button */
      scroll-snap-align:center;
      min-width:340px; flex:1 0 0;
      background:linear-gradient(180deg, color-mix(in oklab, var(--panel) 94%, transparent), var(--panel));
      border:1px solid var(--border); border-radius:var(--radius);
      box-shadow:0 14px 40px rgba(0,0,0,.2), inset 0 0 0 1px rgba(255,255,255,.02);
      padding:24px;
      display:flex; align-items:center; justify-content:center; text-align:center;
      font-size:20px; font-weight:700;
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .card:hover{transform:translateY(-4px); box-shadow:0 22px 54px rgba(0,0,0,.28); border-color:color-mix(in oklab,var(--border), var(--fg) 35%)}
    .card:hover, .card:focus{ text-decoration:none }  /* never underline */

    /* ===== Contrast (white) contact ===== */
    .contrast{background:#ffffff; color:#111; border-top:1px solid #e9eaee; border-bottom:1px solid #e9eaee}
    .contrast .muted{color:#6b7280}
    .contact-wrap{max-width:820px}
    .contact-card{
      margin-top:18px; max-width:720px;
      border:1px solid #e6e8ec; border-radius:16px; background:#f8fafc;
      padding:22px;
      box-shadow:0 12px 34px rgba(0,0,0,.06);
    }
    .email-chip{
      display:inline-block; margin-top:8px; padding:10px 14px; border-radius:12px; border:1px solid #e6e8ec; background:#fff; color:#111;
    }
    .email-chip:hover{ text-decoration:none; border-color:#111 }

    /* ===== Bottom form ===== */
    .form-section{padding:64px 0}
    .form-card{
      max-width:820px; border:1px solid var(--border); background:var(--panel-2); border-radius:16px;
      padding:22px; box-shadow:0 14px 40px rgba(0,0,0,.18);
    }
    label{display:block; font-size:14px; color:var(--muted); margin:12px 0 6px}
    input, textarea{
      width:100%; padding:12px 14px; color:var(--fg); background:var(--panel); border:1px solid var(--border); border-radius:12px;
      outline:none;
    }
    input:focus, textarea:focus{border-color:color-mix(in oklab,var(--border), var(--fg) 35%)}
    textarea{min-height:140px; resize:vertical}
    .form-actions{margin-top:14px; display:flex; gap:10px}
    .btn{
      display:inline-block; padding:12px 16px; border-radius:12px; border:1px solid var(--border); background:var(--panel);
    }
    .btn:hover{border-color:color-mix(in oklab,var(--border), var(--fg) 25%)}
    .cta{ text-align:center; margin-top:40px }
    footer{margin-top:56px; padding:24px 0; color:var(--muted); border-top:1px solid var(--border)}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="head">
        <a class="brand" href="#top" aria-label="Home">
          <img src="virtup-logo.png" alt="Virtup logo" />
          <span>Virtup</span>
        </a>
        <nav>
          <a href="#about">About</a>
          <a href="#work">Work</a>
          <a href="#contact">Contact</a>
        </nav>
      </div>
    </header>

    <main id="top">
      <!-- Hero -->
      <section class="section hero" id="about">
        <h1 class="title">IT Services.</h1>
        <p class="sub">Simple. Reliable. Maintainable.</p>
      </section>

      <!-- Work -->
      <section class="section section--tight" id="work" aria-label="Work">
        <div class="row">
          <a class="card" href="#form">DevOps &amp; SRE</a>
          <a class="card" href="#form">Backend Engineering</a>
          <a class="card" href="#form">Advisory</a>
        </div>
      </section>

      <!-- Contact (white, left-aligned, no email shown) -->
      <section class="section contrast" id="contact" aria-label="Contact">
        <div class="contact-wrap">
          <h2 style="margin:0 0 6px; font-size:28px; font-weight:800;">Contact</h2>
          <p class="muted" style="margin:0 0 8px;">Prefer email.</p>
          <a id="emailLink" class="email-chip" href="#form">Email</a>
          <div class="contact-card" style="margin-top:20px">
            <div class="muted">We’ll reply within one business day.</div>
          </div>
        </div>
      </section>

      <!-- Form at the end -->
      <section class="form-section" id="form" aria-labelledby="formTitle">
        <h2 id="formTitle" style="margin:0 0 16px; font-size:26px; font-weight:800;">Send a message</h2>
        <div class="form-card">
          <form id="contactForm">
            <label for="name">Name</label>
            <input id="name" name="name" autocomplete="name" placeholder="Your name" required />

            <label for="email">Your email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />

            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="How can we help?" required></textarea>

            <div class="form-actions">
              <button class="btn" type="submit">Send via email</button>
              <a class="btn" href="#top">Back to top</a>
            </div>
          </form>
        </div>
      </section>

      <footer>
        © <span id="y"></span> Virtup.
      </footer>
    </main>
  </div>

  <script>
    // current year
    document.getElementById('y').textContent = new Date().getFullYear();

    // Smooth scroll + focus first field when clicking "Email"
    const emailLink = document.getElementById('emailLink');
    const firstField = document.getElementById('name');
    emailLink.addEventListener('click', (e) => {
      e.preventDefault();
      document.querySelector('#form').scrollIntoView({ behavior: 'smooth', block: 'start' });
      setTimeout(() => firstField.focus(), 400);
    });

    // Build a mailto on submit without showing the address in the UI
    document.getElementById('contactForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const from = document.getElementById('email').value.trim();
      const msg = document.getElementById('message').value.trim();
      const at = '@', user = 'info', dom = 'virtup.eu';
      const to = user + at + dom;
      const subject = encodeURIComponent(`Contact — ${name}`);
      const body = encodeURIComponent(`From: ${from}\n\n${msg}`);
      window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
    });
  </script>
</body>
</html>
